version: '3.8'

services:
  zookeeper:
    image: bitnamilegacy/zookeeper:3.8
    container_name: zookeeper
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    networks:
      - traffic-net

  kafka:
    image: bitnamilegacy/kafka:3.5
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,PLAINTEXT_HOST://:29092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
    networks:
      - traffic-net

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - traffic-net
      
  # -------------------------------------------------------------
  # MICROSERVICES
  # -------------------------------------------------------------

  producer:
    build:
      context: ./backend
      dockerfile: producer-service/Dockerfile
    container_name: producer
    environment:
      - INGESTION_URL=${INGESTION_URL:-http://ingestion:8081/api/ingest/batch}
    depends_on:
      - ingestion
      - edge-node-service
    networks:
      - traffic-net

  ingestion:
    build:
      context: ./backend
      dockerfile: ingestion-service/Dockerfile
    container_name: ingestion
    ports:
      - "8081:8081"
    depends_on:
      - kafka
    networks:
      - traffic-net

  server-blr:
    build:
      context: ./backend
      dockerfile: storage-node/Dockerfile
    container_name: server-blr
    environment:
      NODE_NAME: server-blr
      NODE_REGION: SOUTH
    depends_on:
      - kafka
      - fault-detector
    networks:
      - traffic-net

  server-del:
    build:
      context: ./backend
      dockerfile: storage-node/Dockerfile
    container_name: server-del
    environment:
      NODE_NAME: server-del
      NODE_REGION: NORTH
    depends_on:
      - kafka
      - fault-detector
    networks:
      - traffic-net

  server-mum:
    build:
      context: ./backend
      dockerfile: storage-node/Dockerfile
    container_name: server-mum
    environment:
      NODE_NAME: server-mum
      NODE_REGION: WEST
    depends_on:
      - kafka
      - fault-detector
    networks:
      - traffic-net

  replication-manager:
    build:
      context: ./backend
      dockerfile: replication-manager/Dockerfile
    container_name: replication-manager
    depends_on:
      - kafka
      - server-blr
      - server-del
      - server-mum
    networks:
      - traffic-net

  fault-detector:
    build:
      context: ./backend
      dockerfile: fault-detector/Dockerfile
    container_name: fault-detector
    ports:
      - "8083:8083"
    networks:
      - traffic-net

  analytics-engine:
    build:
      context: ./backend
      dockerfile: analytics-engine/Dockerfile
    container_name: analytics-engine
    depends_on:
      - kafka
    networks:
      - traffic-net

  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - kafka
      - redis
      - server-blr
      - fault-detector
      - analytics-engine
      - user-service
    networks:
      - traffic-net

  user-db:
    image: postgres:15-alpine
    container_name: user-db
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432" # Changed host port to 5433 to avoid conflicts
    networks:
      - traffic-net

  user-service:
    build:
      context: ./backend
      dockerfile: user-service/Dockerfile
    container_name: user-service
    ports:
      - "8084:8084"
    depends_on:
      - user-db
    networks:
      - traffic-net

  edge-node-service:
    build:
      context: ./backend
      dockerfile: edge-node-service/Dockerfile
    container_name: edge-node-service
    environment:
      - EDGE_NODE_ENABLED=false
      - INGESTION_URL=http://ingestion:8081/api/ingest/batch
    ports:
      - "8085:8085"
    networks:
      - traffic-net

  monitoring-service:
    build:
      context: ./backend
      dockerfile: monitoring-service/Dockerfile
    container_name: monitoring-service
    ports:
      - "8086:8086"
    networks:
      - traffic-net

networks:
  traffic-net:
    driver: bridge
